[package]
name = "wilhelm_renderer_imgui"
version = "0.9.0"
edition = "2021"
description = "Dear ImGui integration for wilhelm_renderer"
license = "MIT"
repository = "https://github.com/algonents/wilhelm_renderer_imgui"
keywords = ["imgui", "opengl", "graphics", "gui", "gamedev"]
categories = ["gui", "graphics", "rendering", "game-development"]

exclude = ["target", "imgui.ini"]

[dependencies]
# Direct dep on the sys crate: we need its opaque `GLFWwindow` type for FFI
# signatures, and we reuse its bundled GLFW headers (via DEP_WILHELM_RENDERER_INCLUDE)
# and statically-linked libglfw3 for our ImGui GLFW backend.
# NOTE (feat/kiosk-validation): consumed from git while the fullscreen/X11
# changes are unreleased; both deps MUST point at the same repo/branch or
# two wilhelm_renderer_sys instances collide on links = "wilhelm_renderer".
wilhelm_renderer_sys = { git = "https://github.com/algonents/wilhelm_renderer.git", branch = "feat/kiosk-validation" }

[dev-dependencies]
# The demo example uses the safe rendering API. Library code does not.
wilhelm_renderer = { git = "https://github.com/algonents/wilhelm_renderer.git", branch = "feat/kiosk-validation" }

[build-dependencies]
cmake = "0.1"
